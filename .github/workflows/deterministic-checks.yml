name: Yu-AI-OS 确定性检查

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: yu-ai-os-deterministic-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deterministic-checks:
    name: 确定性检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.base.ref == 'main'
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: 检出可信的目标分支基线
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 确认可信基线并获取 PR 数据
        shell: bash
        run: |
          echo "PR_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git fetch --no-tags --depth=1 origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"

      - name: 检查确定性检查脚本语法
        run: python3 -m py_compile .github/scripts/deterministic_checks.py

      - name: 安装 YAML 解析器
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3

      - name: 运行确定性检查
        run: python3 .github/scripts/deterministic_checks.py
