name: Yu-AI-OS 执行摘要

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: yu-ai-os-executive-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  executive-summary:
    name: 确定性检查与中文摘要
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.base.ref == 'main'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_API_URL: ${{ github.api_url }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SUMMARY_MARKER: '<!-- yu-ai-os-automatic-review -->'
    steps:
      - name: 检出可信的目标分支基线
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 确认可信基线并获取 PR 数据
        shell: bash
        run: |
          echo "PR_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git fetch --no-tags --depth=1 origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"

      - name: 检查执行摘要脚本语法
        run: python3 -m py_compile .github/scripts/executive_summary.py

      - name: 安装 YAML 解析器
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3

      - name: 运行确定性检查并更新中文摘要
        run: python3 .github/scripts/executive_summary.py
